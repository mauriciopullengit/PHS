<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Jarvis — Modelos de Animação</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; font-family: 'Segoe UI', sans-serif; color: #fff; overflow-x: hidden; }

  /* NAV */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; gap: 8px; padding: 14px 24px;
    background: rgba(0,0,0,0.85); backdrop-filter: blur(10px);
    border-bottom: 1px solid #ffffff15;
  }
  nav button {
    padding: 8px 18px; border-radius: 20px; border: 1px solid #ffffff30;
    background: transparent; color: #aaa; cursor: pointer; font-size: 13px;
    transition: all .2s;
  }
  nav button.active, nav button:hover {
    background: #00d4ff20; border-color: #00d4ff; color: #00d4ff;
  }

  /* PANELS */
  .panel { display: none; height: 100vh; align-items: center; justify-content: center; padding-top: 60px; }
  .panel.active { display: flex; }

  /* ═══════════════════════════════════════════════════════
     MODELO 1 — ONDAS DE ÁUDIO (clássico)
  ═══════════════════════════════════════════════════════ */
  .wave-container {
    display: flex; flex-direction: column; align-items: center; gap: 40px;
  }
  .wave-bars {
    display: flex; align-items: center; gap: 5px; height: 80px;
  }
  .bar {
    width: 4px; background: #00d4ff; border-radius: 2px;
    animation: wave 1.2s ease-in-out infinite;
    box-shadow: 0 0 8px #00d4ff88;
  }
  .bar:nth-child(1)  { animation-delay: 0s;    }
  .bar:nth-child(2)  { animation-delay: .1s;   }
  .bar:nth-child(3)  { animation-delay: .2s;   }
  .bar:nth-child(4)  { animation-delay: .3s;   }
  .bar:nth-child(5)  { animation-delay: .4s;   }
  .bar:nth-child(6)  { animation-delay: .5s;   }
  .bar:nth-child(7)  { animation-delay: .6s;   }
  .bar:nth-child(8)  { animation-delay: .7s;   }
  .bar:nth-child(9)  { animation-delay: .8s;   }
  .bar:nth-child(10) { animation-delay: .9s;   }
  .bar:nth-child(11) { animation-delay: 1s;    }
  .bar:nth-child(12) { animation-delay: 1.1s;  }
  @keyframes wave {
    0%, 100% { height: 6px; }
    50%       { height: 60px; }
  }
  .wave-label { color: #00d4ff; font-size: 13px; letter-spacing: 4px; text-transform: uppercase; opacity: .7; }
  .wave-text  { font-size: 22px; color: #fff; font-weight: 300; letter-spacing: 2px; min-height: 32px; }

  /* ═══════════════════════════════════════════════════════
     MODELO 2 — ORB / ESFERA PULSANTE
  ═══════════════════════════════════════════════════════ */
  .orb-container {
    display: flex; flex-direction: column; align-items: center; gap: 50px;
  }
  .orb-wrapper { position: relative; width: 200px; height: 200px; }
  .orb {
    position: absolute; inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #00eaff, #0050ff 50%, #000080);
    animation: orb-pulse 2.5s ease-in-out infinite;
    box-shadow: 0 0 40px #00d4ff88, 0 0 80px #0066ff44, 0 0 120px #003fff22;
  }
  .orb-ring {
    position: absolute; inset: -15px;
    border-radius: 50%;
    border: 1px solid #00d4ff44;
    animation: orb-ring 2.5s ease-in-out infinite;
  }
  .orb-ring2 {
    position: absolute; inset: -30px;
    border-radius: 50%;
    border: 1px solid #00d4ff22;
    animation: orb-ring 2.5s ease-in-out infinite .4s;
  }
  @keyframes orb-pulse {
    0%, 100% { transform: scale(1); box-shadow: 0 0 40px #00d4ff88, 0 0 80px #0066ff44; }
    50%       { transform: scale(1.06); box-shadow: 0 0 60px #00d4ffcc, 0 0 120px #0066ff66; }
  }
  @keyframes orb-ring {
    0%, 100% { transform: scale(1); opacity: .6; }
    50%       { transform: scale(1.12); opacity: .2; }
  }
  .orb-text { font-size: 22px; color: #fff; font-weight: 300; letter-spacing: 2px; min-height: 32px; text-align: center; }
  .orb-status { color: #00d4ff; font-size: 12px; letter-spacing: 5px; text-transform: uppercase; opacity: .7; }

  /* ═══════════════════════════════════════════════════════
     MODELO 3 — CÍRCULO ARCO REATOR (Iron Man)
  ═══════════════════════════════════════════════════════ */
  .arc-container {
    display: flex; flex-direction: column; align-items: center; gap: 50px;
  }
  .arc-wrapper { position: relative; width: 220px; height: 220px; }
  .arc-svg { width: 100%; height: 100%; animation: arc-spin 8s linear infinite; }
  .arc-svg2 { position: absolute; inset: 0; width: 100%; height: 100%; animation: arc-spin 5s linear infinite reverse; }
  .arc-core {
    position: absolute; inset: 40px;
    border-radius: 50%;
    background: radial-gradient(circle, #ffffff, #00d4ff 40%, #004488);
    box-shadow: 0 0 30px #00d4ffcc, 0 0 60px #00aaff88;
    animation: arc-core-pulse 2s ease-in-out infinite;
  }
  @keyframes arc-spin { to { transform: rotate(360deg); } }
  @keyframes arc-core-pulse {
    0%,100% { box-shadow: 0 0 30px #00d4ffcc, 0 0 60px #00aaff88; }
    50%      { box-shadow: 0 0 50px #ffffff, 0 0 90px #00d4ffcc; }
  }
  .arc-text { font-size: 22px; color: #fff; font-weight: 300; letter-spacing: 2px; min-height: 32px; text-align: center; }
  .arc-status { color: #00d4ff; font-size: 12px; letter-spacing: 5px; text-transform: uppercase; opacity: .7; }

  /* ═══════════════════════════════════════════════════════
     MODELO 4 — PARTÍCULAS / GRID HOLOGRÁFICO
  ═══════════════════════════════════════════════════════ */
  #particles-canvas { position: absolute; inset: 0; }
  .holo-container { position: relative; width: 100%; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; }
  .holo-ui {
    position: relative; z-index: 2;
    display: flex; flex-direction: column; align-items: center; gap: 20px;
  }
  .holo-ring {
    width: 160px; height: 160px; border-radius: 50%;
    border: 2px solid #00d4ff66;
    position: relative;
    animation: holo-spin 4s linear infinite;
  }
  .holo-ring::before {
    content: ''; position: absolute; inset: 10px;
    border-radius: 50%; border: 1px solid #00d4ff33;
  }
  .holo-ring::after {
    content: ''; position: absolute; inset: 20px;
    border-radius: 50%; border: 1px solid #00d4ff22;
  }
  .holo-dot {
    position: absolute; top: -5px; left: 50%; transform: translateX(-50%);
    width: 10px; height: 10px; border-radius: 50%; background: #00d4ff;
    box-shadow: 0 0 10px #00d4ff;
  }
  @keyframes holo-spin { to { transform: rotate(360deg); } }
  .holo-text { font-size: 22px; color: #00d4ff; font-weight: 300; letter-spacing: 3px; min-height: 32px; text-align: center; position: relative; z-index: 2; }
  .holo-status { color: #00d4ff88; font-size: 11px; letter-spacing: 6px; text-transform: uppercase; position: relative; z-index: 2; }
  .holo-scanline {
    position: absolute; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, #00d4ff44, transparent);
    animation: scanline 3s linear infinite;
    z-index: 1;
  }
  @keyframes scanline { 0% { top: 60px; } 100% { top: 100vh; } }
</style>
</head>
<body>

<!-- NAV -->
<nav>
  <button class="active" onclick="show(1)">1 — Ondas de Áudio</button>
  <button onclick="show(2)">2 — Orb Pulsante</button>
  <button onclick="show(3)">3 — Arco Reator</button>
  <button onclick="show(4)">4 — Partículas Holo</button>
</nav>

<!-- ── MODELO 1 ── -->
<div class="panel active" id="p1" style="background: #000;">
  <div class="wave-container">
    <div class="wave-label">Francisca está ouvindo</div>
    <div class="wave-bars" id="waveBars"></div>
    <div class="wave-text" id="waveText">Como posso ajudá-lo?</div>
  </div>
</div>

<!-- ── MODELO 2 ── -->
<div class="panel" id="p2" style="background: radial-gradient(ellipse at center, #001a2e 0%, #000 70%);">
  <div class="orb-container">
    <div class="orb-wrapper">
      <div class="orb-ring2"></div>
      <div class="orb-ring"></div>
      <div class="orb"></div>
    </div>
    <div class="orb-status">Aguardando comando</div>
    <div class="orb-text">Como posso ajudá-lo?</div>
  </div>
</div>

<!-- ── MODELO 3 ── -->
<div class="panel" id="p3" style="background: #000814;">
  <div class="arc-container">
    <div class="arc-wrapper">
      <svg class="arc-svg" viewBox="0 0 220 220">
        <circle cx="110" cy="110" r="100" fill="none" stroke="#00d4ff" stroke-width="1.5"
          stroke-dasharray="60 20 30 10 50 15" stroke-linecap="round"/>
        <circle cx="110" cy="110" r="85" fill="none" stroke="#0066ff" stroke-width="1"
          stroke-dasharray="30 40 20 50" stroke-linecap="round"/>
      </svg>
      <svg class="arc-svg2" viewBox="0 0 220 220" style="inset:0">
        <circle cx="110" cy="110" r="72" fill="none" stroke="#00d4ff88" stroke-width="1"
          stroke-dasharray="15 25 40 10" stroke-linecap="round"/>
      </svg>
      <div class="arc-core"></div>
    </div>
    <div class="arc-status">Sistema ativo</div>
    <div class="arc-text">Como posso ajudá-lo?</div>
  </div>
</div>

<!-- ── MODELO 4 ── -->
<div class="panel" id="p4" style="background: #000d1a; overflow: hidden; position: relative;">
  <div class="holo-scanline"></div>
  <canvas id="particles-canvas"></canvas>
  <div class="holo-container">
    <div class="holo-ui">
      <div class="holo-ring">
        <div class="holo-dot"></div>
      </div>
      <div class="holo-status">Sistema Jarvis — Online</div>
      <div class="holo-text">Como posso ajudá-lo?</div>
    </div>
  </div>
</div>

<script>
// Gera as barras de onda
const wb = document.getElementById('waveBars');
for(let i=0;i<24;i++){
  const b=document.createElement('div');
  b.className='bar';
  b.style.animationDelay=(i*0.05)+'s';
  wb.appendChild(b);
}

// Partículas (modelo 4)
const canvas=document.getElementById('particles-canvas');
const ctx=canvas.getContext('2d');
let W,H,pts=[];
function resize(){
  W=canvas.width=window.innerWidth;
  H=canvas.height=window.innerHeight;
}
resize(); window.addEventListener('resize',resize);

for(let i=0;i<80;i++) pts.push({
  x:Math.random()*1200, y:Math.random()*800,
  vx:(Math.random()-.5)*.3, vy:(Math.random()-.5)*.3,
  r:Math.random()*1.5+.5
});

function drawParticles(){
  ctx.clearRect(0,0,W,H);
  pts.forEach(p=>{
    p.x+=p.vx; p.y+=p.vy;
    if(p.x<0||p.x>W) p.vx*=-1;
    if(p.y<0||p.y>H) p.vy*=-1;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle='#00d4ff66'; ctx.fill();
  });
  pts.forEach((a,i)=>pts.slice(i+1).forEach(b=>{
    const d=Math.hypot(a.x-b.x,a.y-b.y);
    if(d<120){
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y);
      ctx.strokeStyle=`rgba(0,212,255,${.15*(1-d/120)})`; ctx.stroke();
    }
  }));
  requestAnimationFrame(drawParticles);
}
drawParticles();

// Navegação
function show(n){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  document.getElementById('p'+n).classList.add('active');
  document.querySelectorAll('nav button')[n-1].classList.add('active');
}
</script>
</body>
</html>
